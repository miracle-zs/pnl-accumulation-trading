server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 43.167.191.253;

    ssl_certificate /etc/letsencrypt/live/43.167.191.253/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/43.167.191.253/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = / {
        return 301 /pnl-trader/;
    }

    location = /pnl-trader {
        return 301 /pnl-trader/;
    }

    location ^~ /pnl-trader/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
