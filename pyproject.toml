[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pnl-periodic-review"
version = "0.1.0"
description = "15-minute periodic review trading system"
requires-python = ">=3.11"
dependencies = [
    "APScheduler>=3.11,<4",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
pnl-trader = "pnl_trader.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pnl_trader*"]

[tool.setuptools.package-data]
"pnl_trader.web" = ["static/*.html", "static/*.css"]
